name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n whatgrew-v1.sh
      # "warning" and above fail the build. The script's two "info" notes
      # (SC2016: jq programs kept in single quotes on purpose) don't.
      - name: ShellCheck
        run: shellcheck --shell=bash --severity=warning whatgrew-v1.sh
